<section class="experience">
  <div class="title"><h1>{{ 'Experience' | t }}</h1></div>
  <div class="timeline">
    @for(exp of experiences(); track exp.period) {
      <div class="timeline-item"><div class="dot"></div><div class="content">
        <span class="period">{{exp.period}}</span><h2>{{exp.title | t}}</h2><h3>{{exp.company}}</h3>
        <p>{{exp.description | t}}</p><app-chips-component [technologies]="exp.technologies"></app-chips-component>
      </div></div>
    }
  </div>
</section>
